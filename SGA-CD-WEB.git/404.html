<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA-CD — Página No Encontrada (404)</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #070B14;
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 75%);
            color: #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .error-card {
            background: #0D1424;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15), inset 0 0 15px rgba(56, 189, 248, 0.05);
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transform: translate3d(0,0,0);
        }
        .error-tag {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            color: #38BDF8;
            font-size: 12px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }
        .error-code {
            font-size: 4.5rem;
            font-weight: 800;
            color: #38BDF8;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            margin: 0;
            line-height: 1;
        }
        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFFFFF;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .error-desc {
            color: #94A3B8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #38BDF8;
            color: #070B14;
            font-weight: 700;
            padding: 0.75rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            min-height: 44px;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .btn-home:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-tag">CODIGO: STD-ERR-404-NOTFOUND</div>
        <div class="error-code">404</div>
        <h1 class="error-title">Recurso no encontrado</h1>
        <p class="error-desc">La ruta o módulo solicitado no está disponible en la plataforma. Verifica el enlace o regresa al panel principal para explorar las disciplinas deportivas y talleres culturales habilitados.</p>
        <a href="index.html" class="btn-home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Volver al Inicio
        </a>
    </div>
</body>
</html>
