[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sga_cd_db"
version = "0.1.0"
description = "Database models and schema for the SGA-CD application."
authors = [{ name = "Jules", email = "jules@example.com" }]
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2,<3", "alembic>=1.13,<2"]

[tool.setuptools]
packages = ["models"]
