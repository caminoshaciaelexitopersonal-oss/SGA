version: '3.8'

services:
  # 1. Base de Datos Relacional PostgreSQL 15
  postgres:
    image: postgres:15-alpine
    container_name: sgacd_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sgacd_db}
      POSTGRES_USER: ${POSTGRES_USER:-sgacd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgacd_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend RESTful FastAPI con Migraciones Automáticas Alembic
  fastapi-backend:
    build:
      context: ./SGA-CD-FASTAPI-BACKEND
      dockerfile: Dockerfile
    container_name: sgacd_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgacd_user}:${POSTGRES_PASSWORD:-sgacd_password}@postgres:5432/${POSTGRES_DB:-sgacd_db}
      SECRET_KEY: ${SECRET_KEY:-sgacd_secret_key_change_in_production_2025}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      API_V1_STR: /api/v1
      PROJECT_NAME: "SGA-CD API Backend"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/catalogo/especialidades || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Frontend Web Client (Single Page Application SPA)
  web-client:
    image: nginx:alpine
    container_name: sgacd_web
    restart: always
    depends_on:
      - fastapi-backend
    ports:
      - "8080:80"
    volumes:
      - ./SGA-CD-WEB.git:/usr/share/nginx/html:ro

  # 4. Cliente Escritorio Flet (Desktop Client Manifest)
  flet-desktop-client:
    build:
      context: ./SGA-CD-APP.git
      dockerfile: Dockerfile
    container_name: sgacd_flet_desktop
    restart: "no"
    depends_on:
      - fastapi-backend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://fastapi-backend:8000}
      TENANT_API_KEY: ${TENANT_API_KEY:-sgacd_default_tenant_key}

  # 5. Cliente Móvil Flet (Mobile / APK Builder Client Manifest)
  flet-mobile-client:
    build:
      context: ./SGA-CD-APK.git
      dockerfile: Dockerfile
    container_name: sgacd_flet_mobile
    restart: "no"
    depends_on:
      - fastapi-backend
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://fastapi-backend:8000}
      TENANT_API_KEY: ${TENANT_API_KEY:-sgacd_default_tenant_key}

volumes:
  postgres_data:
    driver: local
