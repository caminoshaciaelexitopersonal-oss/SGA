<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SGA-CD Promo Video Storyboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1280px;
            height: 720px;
            background-color: #070B14; /* 60% Metal Anodizado Profundo */
            color: #E2E8F0;
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
        }

        .glass-panel {
            background: #0D1424; /* 30% Glassmorphic Surface */
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 40px;
            width: 80%;
            text-align: center;
            position: relative;
        }

        .glow-title {
            color: #38BDF8; /* 10% Cyan Specular Glow */
            font-size: 2.8rem;
            font-weight: 800;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .subtitle {
            color: #94A3B8;
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .taxonomy-pills {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .pill {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38BDF8;
            color: #38BDF8;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1 class="glow-title">SGA-CD — Plataforma de Gestión Cultural y Deportiva</h1>
        <p class="subtitle">Seguimiento en Tiempo Real, Control de Asistencia Offline PWA y Acreditación Atlética/Artística</p>
        <div class="taxonomy-pills">
            <div class="pill">Disciplinas Deportivas</div>
            <div class="pill">Talleres Culturales (Danza & Instrumentos)</div>
            <div class="pill">Suscripción Estudiantil Costo 0</div>
        </div>
    </div>
</body>
</html>
